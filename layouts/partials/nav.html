<nav class="nav2">

  <a href="{{ "/" | relURL }}" class="nav-logo">
    <img
      src="{{ .Site.Params.logo.url | relURL }}"
      width="{{ .Site.Params.logo.width }}"
      height="{{ .Site.Params.logo.height }}"
      alt="{{ .Site.Params.logo.alt }}"
    >
  </a>

  <ul class="nav-links">
    {{ range .Site.Menus.en }}
      <li>
        <a href="{{ .URL | relURL }}">
          {{ .Name }}
        </a>
      </li>
    {{ end }}
  </ul>

</nav>
